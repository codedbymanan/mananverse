<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tech Event Sign Up</title>
  <style>
    body {
font-family: 'Audiowide', cursive;
    background: linear-gradient(to bottom right, #1e1e2f, #0f1c2e);
      padding: 0px ;
    }
    form {
      background-color: white;
      max-width: 600px;
      margin: auto ;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 10px 20px 30px rgba(36, 106, 122, 0.5);
    }
    h3 {
      color: #ffffff;
    }
    label {
      display:inline-block;
      margin-top: 15px;
      font-weight: bold;
    }
   
    input[type="text"],
    input[type="email"],
    input[type="tel"]{
      width: 95%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #070606;
      border-radius: 4px;
    }
    summary {
  cursor: pointer;
  font-size: 18px;
  padding: 10px;
  background-color: #3E8AA9 ;
  color: #ffffff;
  border-radius: 4px;
}
details {
  margin-bottom: 15px;
  border: 1px solid #ccc;
  padding: 10px;
  background-color: 
  #f9f9f9;
}
input[type="radio"] {
  margin-right: 8px;
  vertical-align: middle;
}
input[type="file"]{
margin-top:8px;
padding: 10px;
background-color: #f9f9f9;
}
textarea {
  width: 95%;
  height: 50px;
  padding: 10px;
  border: 1px solid #070606;
  border-radius: 4px;
  font-size: 16px;
  resize: vertical;
  margin-top : 10px;
  vertical-align : left
}

#addon{
  font-size:50px;
  margin-left: 4px;
}
#Header{
  margin-top:0px;
  text-align:center;
  font-size: 27px;
  color :rgb(233, 14, 29);
  text-shadow: 1px 3px 4px #c4aeae;
}
.submit-container {
  text-align: center;
  margin-top: 20px;
}

.submit-btn {
  background-color: #3E8AA9;
  color: white;
  font-family: 'Audiowide', cursive; 
  font-size: 16px;
  padding: 10px 25px;
  border: none;
  border-radius: 6px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.submit-btn:hover {
  background-color: #337c93;
}

   </style>
</head>
<body>

  <div id="Header">
    <p id="content">
      Hurry Up!! <br>
      Registration Closing Soon 
    </p>
  </div>

  <form action="#" onsubmit="alert('Form submitted!'); return false;">
   

    <details>
  <summary><strong> <h3>Basic Information</h3> </strong></summary>
  <label for="name">Name:</label>
  <input type="text" id="name" placeholder="Full Name" required>

  <label for="email">E-Mail:</label>
  <input type="email" id="email" placeholder="E-Mail" required>

  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" pattern="\d{10}" maxlength="10" inputmode="numeric" placeholder="10-digit Phone Number" required>

  <label for="college">College/Organisation:</label>
  <input type="text" id="college" placeholder="Name of College/Organisation" required>
</details>

<details>
  <summary><strong><h3>Session Preferences</h3></strong></summary>

  <label>
    <input type="checkbox" name="sessions" value="ai-ml"> AI & Machine Learning
  </label><br>

  <label>
    <input type="checkbox" name="sessions" value="web-dev"> Web Development
  </label><br>

  <label>
    <input type="checkbox" name="sessions" value="cybersecurity"> Cybersecurity
  </label><br>

  <label>
    <input type="checkbox" name="sessions" value="ui-ux"> UI/UX Design
  </label><br>

  <label>
    <input type="checkbox" name="sessions" value="startup-pitch"> Startup Pitch Zone
  </label>

</details>

<details >
  <summary><strong><h3> Experirnce Level</h3></strong></summary>

  <label>
    <input type="radio" value="beginner" name="experience">Beginner
  </label><br>
   <label>
    <input type="radio" value="Intermediate" name="experience">Intermediate
  </label><br>
   <label>
    <input type="radio" value="Advanced" name="experience">Advanced
  </label><br>
</details>

<details>
  <summary><strong><h3>Upload Resume or Portfolio</h3></strong></summary>

  <label for="resume"></label>
  <input type="file" id="resume" name="resume" accept=".pdf" required>
</details>

<details>
  <summary><strong><h3>Optional Add-ons</h3></strong></summary>

 <label>Choose an add-on :  </label>
  <select name="addon" id="addon">
    <option value="">--- Select an option ---</option>
    <option value="gaming">Join Gaming Zone</option>
    <option value="night-coding">Attend Night Coding Jam</option>
    <option value="swag">Free Swag Pack</option>
  </select>

</details>
<details >
<Summary><strong><h3>What Excites You most About this Event?</h3></strong></Summary>
</label for="short answer">
<textarea placeholder ="Type Something Here"></textarea>
</label>
</details>


<div class="submit-container">
  <button type="submit" class="submit-btn">Submit</button>
</div>

</form>

</body>

</html>
